# Syncthing on the DSM app chassis. Read by chassis/build.sh and the tests.
PKG_NAME=syncthing
PKG_TITLE="Syncthing"
PKG_DESC="Syncthing in Container Manager: keeps folders in step between this Synology, your computers and your phone, directly and privately, with no cloud in between. A DSM window pairs devices (with a QR code for the phone app), syncs your shared folders, shows what changed and from where, sorts out conflicting copies, keeps old versions, and can keep everything on your own network. Backups, updates and the password are handled too."
APP_ID="Syncthing.AppInstance"
REPO=tombruton87/syncthing-dsm
SERVICES="server"
VOLUMES="config"
IMAGE_VARS="ST_IMAGE"
PORT=8384
PORTS="8384 8385 8386 8394"
HEALTH_PATH=/rest/noauth/health
APP_ACTIONS="devaccept|devignore|devadd|devpause|devremove|devrename|folderadd|folderedit|folderversions|folderignores|folderscan|folderpause|folderoverride|folderrevert|folderremove|folderaccept|folderdecline|conflictkeep|conflictdrop|conflictscan|privacy|syncport|newpw|sharescan"
APP_ANSWER_KEYS="SYNC_PORT PRIVACY NET_MODE TEST_SHARES"
APP_REQUEST_KEYS="DEV_ID DEV_NAME_B64 DEV_ADDR_B64 PAUSE FID_B64 FLABEL_B64 FPATH_B64 FTYPE FDEVICES VTYPE VKEEP VDAYS IGN_B64 CONFLICT_B64 PRIVACY MAX_SEND MAX_RECV LAN_LIMIT SYNC_PORT NET_MODE"
TAGLINE="File sync"
WELCOME="Syncthing keeps folders in step between this Synology, your computers and your phone — directly between your devices, encrypted, with no cloud account in between. This package runs it in Container Manager and adds a window to DSM: pair devices (a QR code for the phone app), pick which shared folders to sync with whom, see what changed and from where, sort out conflicting copies, keep old versions, and choose whether Syncthing may reach the internet or stays on your own network."
BACKUP_WHAT="Syncthing's settings and this Synology's device identity (its certificate and key, so paired devices still recognise it after a restore), the list of devices and folders, versioning and ignore patterns. Your synced files stay in their shared folders and aren't part of it; after a restore Syncthing reads them again."
SITE_NOTE="The address of Syncthing's own web interface (the GUI). Devices sync with each other on the sync port (the Privacy and network tab), not on this one."
ICON_TOP="#26B6DB"
ICON_BOTTOM="#0882C8"
ICON_LETTER="S"   # only if icon.png is missing
BETA=yes
